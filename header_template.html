<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/header_template.css">
    <script src="static/header_template.js"></script>
    <title>Template do Header</title>
</head>
<body>
    <div class="container">
        <header>
            <div class="user-info">
                <a href="#"><img class="prof-pic" src="static/images/profile_pic.png" alt="user"></a>
                <div class="user-text">
                    <p>User name</p>
                    <p>University name</p>
                </div>
            </div>

            <div class="logo">
                <img class="logo-img" src="static/images/logoz.svg" alt="Logo">
            </div>
        </header>

        <main>
            <div class="main-card">
                <div class="main-title">
                    <h1>Título da Sua Página</h1>
                </div>
                
                <div class="main-content">
                    <!-- Aqui você pode adicionar o conteúdo específico da sua página -->
                    <p>Este é um template do header. Substitua este conteúdo pelo conteúdo específico da sua página.</p>
                    
                    <div class="example-content">
                        <h2>Exemplo de Conteúdo</h2>
                        <p>Você pode usar este template como base para suas páginas, mantendo o header consistente em todo o projeto.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
